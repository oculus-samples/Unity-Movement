name: Create a release

on:
  push:
    branches:
    - main
    tags-ignore:
      - "**"
  workflow_dispatch:
  workflow_call:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'
      - name: Extract Version from package.json
        id: package_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          draft: false
          prerelease: false
      - name: Get Changelog Entry
        id: changelog
        run: |
          VERSION=${{ env.VERSION }}
          echo "Looking for changelog entries for version $VERSION"
          # Print the lines under "## [$VERSION]" up to the next "## [" version header.
          # Splitting records on "## " stopped at the first "## What's New" sub-heading and left the release body empty.
          CHANGELOG=$(awk -v ver="## [$VERSION]" 'index($0, "## [") == 1 { p = (index($0, ver) == 1); next } p' CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            echo "No changelog entry found for version $VERSION"
          else
            echo "Changelog entry found:"
            echo "$CHANGELOG"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Update Release
        uses: actions/github-script@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = process.env.CHANGELOG;
            github.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.create_release.outputs.id }},
              body: body
            })
